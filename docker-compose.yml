services:
  init-dirs:
    image: alpine:3.21
    container_name: mediaserver-init-dirs
    user: "0:0"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config:/config
      - ./media:/media
      - ./scripts/setup-dirs-container.sh:/setup-dirs.sh:ro
    entrypoint: ["/bin/sh", "/setup-dirs.sh"]
    restart: "no"

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - ./media:/media
    ports:
      - 8096:8096
      - 7359:7359/udp
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    hostname: plex
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      - ADVERTISE_IP=http://${PLEX_ADVERTISE_HOST:-127.0.0.1}:32400/
    volumes:
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      - ./media:/media
    ports:
      - 32400:32400
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Accept: application/json' http://127.0.0.1:32400/identity >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped


  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: emby
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    volumes:
      - ./config/emby:/config
      - ./media/movie:/media/movie:ro
      - ./media/show:/media/show:ro
    ports:
      - "8097:8096"
    restart: unless-stopped


  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ./media:/media
      - ./media/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ./media:/media
      - ./media/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  nzbget:
    image: nzbgetcom/nzbget:latest
    container_name: nzbget
    depends_on:
      init-dirs:
        condition: service_completed_successfully
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - NZBGET_USER=${NZBGET_USER}
      - NZBGET_PASS=${NZBGET_PASS}
    volumes:
      - ./config/nzbget:/config
      - ./media:/media
      - ./media/downloads:/downloads
    ports:
      - 6789:6789
    restart: unless-stopped

  bootstrap:
    image: alpine:3.21
    container_name: mediaserver-bootstrap
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      jellyfin:
        condition: service_started
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
      nzbget:
        condition: service_started
    environment:
      - TZ=${TZ}
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD}
      - MOVIE_PATH=${MOVIE_PATH:-/media/movie}
      - SHOW_PATH=${SHOW_PATH:-/media/show}
      - NZBGET_USER=${NZBGET_USER}
      - NZBGET_PASS=${NZBGET_PASS}
      - NZBGET_NEWS_HOST=${NZBGET_NEWS_HOST:-}
      - NZBGET_NEWS_PORT=${NZBGET_NEWS_PORT:-563}
      - NZBGET_NEWS_USER=${NZBGET_NEWS_USER:-}
      - NZBGET_NEWS_PASS=${NZBGET_NEWS_PASS:-}
      - NZBGET_NEWS_CONNECTIONS=${NZBGET_NEWS_CONNECTIONS:-8}
      - NZBGET_ARTICLE_CACHE=${NZBGET_ARTICLE_CACHE:-256}
      - NZBGET_WRITE_BUFFER=${NZBGET_WRITE_BUFFER:-1024}
      - NEWZNAB_URL=${NEWZNAB_URL:-}
      - NEWZNAB_API=${NEWZNAB_API:-}
      - NEWZNAB_NAME=${NEWZNAB_NAME:-Newznab}
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
      - ./config/sonarr:/sonarr:ro
      - ./config/radarr:/radarr:ro
      - ./config/nzbget:/nzbget
      - ./media:/media
      - ./media/downloads:/downloads
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
